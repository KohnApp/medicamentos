<style>

@media (max-width:480px){.resumen b{font-size:1.3rem}.tomasgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.thumbs{display:flex;gap:6px;flex-shrink:0}

input[readonly]{opacity:.75}

</style></head><body>
<div class="wrap">
  <header>
    <h1 id="titulo">Medicamentos</h1>
    <div class="hoy"><span id="hoy"></span></div>
  </header>
  <div id="setup" hidden>
    <div class="loginbox">
      <h2>Bienvenido</h2>
      <p class="muted small">Esta app guarda los datos <b>solamente en este dispositivo</b>. No pasan por ningún servidor.</p>
      <form id="fSetup">
        <label>Nombre de quien toma los remedios<input id="s-pac" type="text" required placeholder="Tu nombre" autocomplete="off"></label>
        <div class="err" id="s-err"></div>
        <div class="formfoot"><button type="submit" class="btn primary">Empezar</button></div>
      </form>
      <hr class="sep">
      <p class="muted small">¿Ya tenés una copia de tus datos (archivo .json)?</p>
      <label class="btn fbtn">Restaurar desde una copia<input type="file" id="s-file" accept=".json,application/json" hidden></label>
    </div>
  </div>
  <div id="app" hidden>
    <nav role="tablist">
      <button role="tab" data-tab="tomas" aria-selected="true">Tomas</button>
      <button role="tab" data-tab="stock" aria-selected="false">Stock</button>
      <button role="tab" data-tab="reponer" aria-selected="false">Reponer<span class="badge" id="badge" hidden></span></button>
      <button role="tab" data-tab="historial" aria-selected="false">Historial</button>
    </nav>
    <section id="tab-tomas"><div class="empty">Cargando los medicamentos…</div></section>
    <section id="tab-stock" hidden></section>
    <section id="tab-reponer" hidden></section>
    <section id="tab-historial" hidden></section>
  </div>
  <div id="cargando" class="empty">Cargando…</div>
</div>
<div id="modal"></div>
<script>
(function(){
'use strict';
const APP_VERSION='1.1.0';
const SCHEMA=1;

/* =====================================================================
   1) BASE DE DATOS LOCAL (IndexedDB) — reemplaza a la planilla de Google
   ===================================================================== */
const Store=(()=>{
  const NAME='medicamentos',STORE='kv';let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{let r;try{r=indexedDB.open(NAME,1)}catch(e){rej(e);return}
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('No se pudo abrir la base'))}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction(STORE,mode);const st=t.objectStore(STORE);let out;const r=fn(st);
    if(r)r.onsuccess=()=>{out=r.result};
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Se canceló la grabación'))}));
  const putAll=(st,obj)=>Object.keys(obj).forEach(k=>obj[k]===undefined?st.delete(k):st.put(obj[k],k));
  return{
    get:k=>tx('readonly',st=>st.get(k)),
    keys:()=>tx('readonly',st=>st.getAllKeys()),
    put:obj=>tx('readwrite',st=>{putAll(st,obj)}),
    replace:obj=>tx('readwrite',st=>{st.clear();putAll(st,obj)})
  };
})();

const D={config:null,meds:[],movs:[],marcas:[],fotos:{}};
const MAXMOV=5000;

async function cargarDB(){
  const ks=['config','meds','movs','marcas','fotos','schema'];
  const v=await Promise.all(ks.map(k=>Store.get(k)));
  D.config=v[0]||null;D.meds=v[1]||[];D.movs=v[2]||[];D.marcas=v[3]||[];D.fotos=v[4]||{};
  await migrar(v[5]);
}
/* Si en una versión futura cambia la forma de guardar los datos, la conversión va acá. */
async function migrar(v){
  if(v===SCHEMA)return;
  // if(v===1){ ...convertir de la estructura 1 a la 2... }
  await Store.put({schema:SCHEMA});
}
async function guardar(keys,extra){
  const o=Object.assign({},extra||{});keys.forEach(k=>{o[k]=D[k]});
  try{await Store.put(o)}
  catch(e){if(e&&e.name==='QuotaExceededError')throw fail('El dispositivo no tiene más espacio para guardar. Probá borrar fotos que no uses.');throw e}
}

/* =====================================================================
   2) LÓGICA (equivalente a Código.gs, Marcas.gs y Fotos.gs)
   ===================================================================== */
const MOMS=['desayuno','almuerzo','merienda','cena','dormir','parche'];
const MOM_TXT={desayuno:'Desayuno',almuerzo:'Almuerzo',merienda:'Merienda',cena:'Cena',dormir:'Al dormir',parche:'Parche'};
const hoy_=()=>todayISO();
const ahora_=()=>{const d=new Date();return todayISO()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const num_=v=>{if(v===''||v===null||v===undefined)return null;const n=Number(String(v).replace(',','.'));return isNaN(n)?null:n};
const iso_=v=>{const s=String(v??'').trim();if(!s)return null;const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null};
const rid=()=>{let s='';for(let i=0;i<8;i++)s+=Math.floor(Math.random()*16).toString(16);return s};
const clone=o=>JSON.parse(JSON.stringify(o));
const consumo_=m=>MOMS.reduce((s,k)=>s+(Number(m.tomas&&m.tomas[k])||0),0);
function stockAl_(m,iso){if(m.stock===null||m.stock===undefined)return null;const c=consumo_(m);if(!c||m.alternativo||!m.stockFecha)return m.stock;
  const d=Math.max(0,toDay(iso)-toDay(m.stockFecha));return Math.max(0,m.stock-c*d)}
const quien_=()=>''; /* app individual: no se registra quién */
function logMov_(o){
  D.movs.push({fechaHora:ahora_(),quien:o.quien||'',tipo:o.tipo||'',medId:o.medId||'',medNombre:o.medNombre||'',fecha:o.fecha||hoy_(),
    cantidad:o.cantidad??null,stockAntes:o.stockAntes??null,stockDespues:o.stockDespues??null,detalle:o.detalle||'',nota:o.nota||''});
  if(D.movs.length>MAXMOV)D.movs.splice(0,D.movs.length-MAXMOV);
}
function findMed_(id){const m=D.meds.find(x=>x.id===id);if(!m)throw fail('No encontré ese medicamento.');return m}
function payload_(){
  const c=D.config||{};
  return{config:{paciente:c.paciente,avisoDias:c.avisoDias,cubrirDias:c.cubrirDias},
    meds:clone(D.meds),movs:clone(D.movs.slice(-200).reverse()),hoy:hoy_()};
}
const fq_=fq;

/* ---- Marcas ---- */
const marcasDe_=medId=>D.marcas.filter(x=>x.medId===medId);
function asegurarMarcas_(){
  let cambio=false;
  D.meds.forEach(m=>{const mias=marcasDe_(m.id);
    if(!mias.length){
      D.marcas.push({id:'mk-'+rid(),medId:m.id,nombre:m.nombre,porCaja:m.porCaja??null,actual:true,alta:ahora_()});
      const vistos=[m.nombre.toLowerCase()];
      String(m.equivalentes||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(nom=>{
        if(vistos.indexOf(nom.toLowerCase())>=0)return;vistos.push(nom.toLowerCase());
        D.marcas.push({id:'mk-'+rid(),medId:m.id,nombre:nom,porCaja:null,actual:false,alta:ahora_()})});
      cambio=true;
    }else if(!mias.some(x=>x.actual)){mias[0].actual=true;cambio=true}
  });
  return cambio;
}
function marcasPorMed_(){
  const out={};
  D.marcas.forEach(x=>{(out[x.medId]=out[x.medId]||[]).push({id:x.id,nombre:x.nombre,porCaja:x.porCaja??null,actual:!!x.actual})});
  Object.keys(out).forEach(k=>out[k].sort((a,b)=>(b.actual-a.actual)||a.nombre.localeCompare(b.nombre,'es')));
  return out;
}
function aplicarMarca_(medId){
  const ms=marcasDe_(medId);const act=ms.find(x=>x.actual);if(!act)return;
  const m=D.meds.find(x=>x.id===medId);if(!m)return;
  m.nombre=act.nombre;m.porCaja=act.porCaja??null;m.equivalentes=ms.filter(x=>!x.actual).map(x=>x.nombre).join(', ');
}
const respMarcas_=extra=>guardar(['meds','movs','marcas','fotos'],extra).then(()=>({data:payload_(),marcas:marcasPorMed_()}));
function quitarFotosDeMarca_(marcaId,extra){const f=D.fotos[marcaId];if(!f)return;Object.keys(f).forEach(t=>{if(f[t]&&f[t].file)extra['foto:'+f[t].file]=undefined});delete D.fotos[marcaId]}

/* ---- Funciones que llama la pantalla (mismos nombres que en Apps Script) ---- */
const B={
  setup(paciente){
    D.config={paciente:paciente,avisoDias:7,cubrirDias:30,creado:ahora_(),ultimaCopia:null};
    D.meds=[];D.movs=[];D.marcas=[];D.fotos={};
    logMov_({tipo:'Inicio',detalle:'Se creó la base en este dispositivo'});
    return Store.replace({config:D.config,meds:D.meds,movs:D.movs,marcas:D.marcas,fotos:D.fotos,schema:SCHEMA});
  },
  getData(){return payload_()},

  corregirStock(_,quien,p){
    const fe=iso_(p.fecha)||hoy_(),q=quien_(quien);
    (p.items||[]).forEach(it=>{const m=D.meds.find(x=>x.id===it.medId);const v=Number(it.stock);if(!m||!(v>=0))return;
      const antes=stockAl_(m,fe);m.stock=v;m.stockFecha=fe;

const MOMENTOS=[{k:'desayuno',l:'Desayuno'},{k:'almuerzo',l:'Almuerzo'},{k:'merienda',l:'Merienda'},{k:'cena',l:'Cena'},{k:'dormir',l:'Al dormir'},{k:'parche',l:'Parche (cambio diario)'}];
const UNIDADES={comprimido:['comprimido','comprimidos'],capsula:['cápsula','cápsulas'],parche:['parche','parches'],sobre:['sobre','sobres'],otro:['unidad','unidades']};
const S={meds:new Map(),movs:[],config:{avisoDias:7,cubrirDias:30},ready:false,showInactive:false,tab:'tomas',fotos:{},marcas:{},clave:'local',quien:'',hoy:null,urgentes:0};

function applyData(d){S.meds=new Map(d.meds.map(m=>[m.id,m]));S.movs=d.movs||[];S.config=d.config||S.config;S.hoy=d.hoy;S.ready=true;render();return d}

function pad(n){return String(n).padStart(2,'0')}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toDay(iso){const [y,m,d]=iso.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)}
const fromDay=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const wd=iso=>new Date(toDay(iso)*864e5).toLocaleDateString('es-AR',{weekday:'short',timeZone:'UTC'}).replace('.','');
const fmtD=iso=>{if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return iso||'—';const [y,m,d]=iso.split('-');return d+'/'+m+(y!==todayISO().slice(0,4)?'/'+y.slice(2):'')};
const fmtDL=iso=>iso?wd(iso)+' '+fmtD(iso):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fq(n){if(n==null||isNaN(n))return '—';const r=Math.round(n*2)/2;const i=Math.floor(r);if(r-i===.5)return (i?i:'')+'½';return String(i)}
const unidad=(m,n)=>{const u=UNIDADES[m.unidad]||UNIDADES.comprimido;return Math.abs(n)===1?u[0]:u[1]};
function consumo(m){return MOMENTOS.reduce((s,x)=>s+(Number(m.tomas&&m.tomas[x.k])||0),0)}
function stockAl(m,iso){const c=consumo(m);if(m.stock==null)return null;if(!c||m.alternativo||!m.stockFecha)return Number(m.stock);const d=Math.max(0,toDay(iso)-toDay(m.stockFecha));return Math.max(0,Number(m.stock)-c*d)}
function calc(m){
  const hoy=todayISO(),c=consumo(m),aviso=Number(S.config.avisoDias)||7,cubrir=Number(S.config.cubrirDias)||30;
  const out={c,est:stockAl(m,hoy),estado:'neutral',restan:null,hasta:null,cajas:null,faltan:null};
  if(m.activo===false){out.estado='inactivo';return out}
  if(m.alternativo||!c){out.estado='demanda';return out}
  if(m.stock==null||!m.stockFecha){out.estado='sin-datos';return out}
  const hd=toDay(m.stockFecha)+Math.floor(Number(m.stock)/c+1e-9);
  out.hasta=fromDay(hd);out.restan=hd-toDay(hoy);
  out.estado=out.restan<=0?'agotado':out.restan<=aviso?'reponer':'ok';
  out.faltan=Math.max(0,c*cubrir-out.est);
  const pc=Number(m.porCaja)||0;
  if(pc)out.cajas=Math.max(1,Math.ceil(out.faltan/pc));
  out.diasDesdeRecuento=toDay(hoy)-toDay(m.stockFecha);
  return out;
}

  const acts='<div class="actions"><button class="btn primary" data-act="compra" data-id="'+esc(m.id)+'">Registrar compra</button><button class="btn" data-act="recuento" data-id="'+esc(m.id)+'">Corregir stock</button></div>';

    '<div class="facts">'+facts.join('')+'</div>'+stale+acts+'</div></article>';
}

    '<div class="muted small">Los datos se guardan solo en este dispositivo. Si borrás la app o cambiás de teléfono, se pierden. Exportá una copia de vez en cuando y guardala en Archivos, Drive o mandátela por mail.</div>'+
    '<div class="small">Última copia: <b>'+(ult?esc(fmtD(ult.slice(0,10))+' '+ult.slice(11)):'nunca')+'</b></div>'+
    '<div class="actions"><button type="button" class="btn primary" id="g-exp">Exportar mis datos</button><label class="btn fbtn" style="display:inline-block">Restaurar desde una copia<input type="file" id="g-imp" accept=".json,application/json" hidden></label></div></div>'+
    '<p class="muted small" style="margin-top:14px">Versión '+APP_VERSION+' · Modo sin conexión: '+offline+'</p>',
  async f=>{
    await call('guardarAjustes',{paciente:f.querySelector('#g-pac').value.trim(),avisoDias:Number(f.querySelector('#g-aviso').value)||7,cubrirDias:Number(f.querySelector('#g-cubrir').value)||30});
    toast('Ajustes guardados');
  },ov=>{
    ov.querySelector('#g-exp').addEventListener('click',e=>exportar(e.currentTarget));
    ov.querySelector('#g-imp').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)restaurarArchivo(f)});
  });
}
async function exportar(btn){
  const t=btn.textContent;btn.disabled=true;btn.textContent='Preparando…';
  try{
    const data=await B.exportar();const txt=JSON.stringify(data);
    const name='Medicamentos '+(S.config.paciente||'')+' '+todayISO()+'.json';
    const blob=new Blob([txt],{type:'application/json'});let file=null;try{file=new File([blob],name,{type:'application/json'})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name})}catch(e){if(e&&e.name==='AbortError')return;throw e}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},8000);
    }
    toast('Copia lista');closeModal();
  }catch(x){toast(errMsg(x),3500)}
  finally{btn.disabled=false;btn.textContent=t}
}
function restaurarArchivo(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('No se pudo leer el archivo.',3500);
  fr.onload=async()=>{
    let obj;try{obj=JSON.parse(fr.result)}catch(e){toast('Ese archivo no es una copia válida.',3500);return}
    if(D.config&&!confirm('Esto REEMPLAZA todos los datos de este dispositivo por los de la copia. ¿Seguir?'))return;
    try{
      await B.importar(obj);
      S.config=Object.assign({},S.config,D.config);S.ready=false;S.marcas={};S.fotos={};closeModal();setTitle();
      toast('Datos restaurados: '+D.meds.length+' medicamentos',3000);
      entrar();
    }catch(x){toast(errMsg(x),4000)}
  };
  fr.readAsText(file);
}
function verHoja(){
  const meds=sortedMeds().filter(m=>m.activo!==false);
  const LAB={desayuno:'Desayuno',almuerzo:'Almuerzo',merienda:'Merienda',cena:'Cena',dormir:'Al dormir',parche:'Parche (cambio diario)'};
  const td='style="padding:5px 8px;border-bottom:1px solid #ccc;text-align:left;vertical-align:top"';
  const th='style="text-align:left;padding:5px 8px;border-bottom:2px solid #14252A;"';
  const ahora=new Date();const fecha=pad(ahora.getDate())+'/'+pad(ahora.getMonth()+1)+'/'+ahora.getFullYear();
  let rows='';
  MOMENTOS.forEach(x=>{
    const items=meds.filter(m=>!m.alternativo&&m.tomas&&m.tomas[x.k]);if(!items.length)return;
    rows+='<tr><td colspan="5" style="background:#DCEDEF;font-weight:bold;padding:6px 8px;">'+LAB[x.k]+'</td></tr>';
    items.forEach(m=>{const q=m.tomas[x.k];
      rows+='<tr><td '+td+'><b>'+esc(m.nombre)+'</b></td><td '+td+'>'+esc(m.droga)+'</td><td '+td+'>'+esc(m.dosis)+'</td><td '+td+'>'+fq(q)+' '+esc(unidad(m,q))+'</td><td '+td+'>'+esc(m.accion)+(m.notas?' — '+esc(m.notas):'')+'</td></tr>'});
  });
  const dem=meds.filter(m=>m.alternativo);
  const demHtml=dem.length?'<h3 style="font-size:13pt;margin:18px 0 6px;color:#14252A">A demanda (solo si hace falta)</h3><table style="width:100%;border-collapse:collapse;font-size:10.5pt;color:#14252A">'+
    dem.map(m=>'<tr><td '+td+'><b>'+esc(m.nombre)+'</b></td><td '+td+'>'+esc(m.droga)+'</td><td '+td+'>'+esc(m.dosis)+'</td><td '+td+'>'+esc(m.accion)+'</td></tr>').join('')+'</table>':'';
  const hoja='<div style="font-family:Arial,sans-serif;color:#14252A">'+
    '<h2 style="font-size:16pt;margin:0 0 4px;color:#14252A">Medicación de '+esc(S.config.paciente||'')+'</h2>'+
    '<div style="font-size:10pt;color:#566A70;margin-bottom:14px;">Tomas diarias · actualizado al '+fecha+'</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:10.5pt;color:#14252A"><tr><th '+th+'>Medicamento</th><th '+th+'>Droga</th><th '+th+'>Dosis</th><th '+th+'>Cantidad</th><th '+th+'>Para qué / notas</th></tr>'+
    (rows||'<tr><td colspan="5" '+td+'>No hay tomas diarias cargadas.</td></tr>')+'</table>'+demHtml+
    '<div style="font-size:8.5pt;color:#566A70;margin-top:22px;">Generado el '+fecha+' '+pad(ahora.getHours())+':'+pad(ahora.getMinutes())+'.</div></div>';
  openModal('<div class="noprint"><h3>Hoja para el médico</h3><div class="muted small">Para guardarla como PDF: tocá <b>Imprimir / PDF</b>. En el iPhone, en la pantalla de impresión tocá el botón de compartir (arriba) y elegí Guardar en Archivos, WhatsApp o Mail.</div></div>'+
    '<div class="hoja">'+hoja+'</div>'+
    '<div class="formfoot noprint"><button type="button" class="btn" data-close>Cerrar</button><button type="button" class="btn primary" id="imprimir">Imprimir / PDF</button></div>',null,
    ov=>{ov.querySelector('#imprimir').addEventListener('click',()=>{try{window.print()}catch(e){toast('Este navegador no deja imprimir desde acá.',3000)}})});
}
function cargarExtras(){
  return Promise.all([api('getFotos',S.clave).then(f=>{S.fotos=f||{}}).catch(()=>{}),api('getMarcas',S.clave).then(x=>{S.marcas=x||{}}).catch(()=>{})])
   .then(()=>{if(S.ready){renderTomas();renderStock()}})}
function aplicarResp(r){if(r&&r.marcas)S.marcas=r.marcas;if(r&&r.data)applyData(r.data)}
function marcasDe(m){return S.marcas[m.id]||[]}
function marcaActual(m){const l=marcasDe(m);return l.find(x=>x.actual)||l[0]||null}
function fotoDe(id,t){const f=S.fotos[id];return f&&f[t]?f[t]:null}
function thumbs(m){const mk=marcaActual(m);if(!mk)return '';const c=fotoDe(mk.id,'caja'),p=fotoDe(mk.id,'pastilla');if(!c&&!p)return '';
  const one=(f,t)=>f?'<button type="button" class="thumb" data-fotofile="'+esc(f.file)+'" data-fototit="'+esc(mk.nombre+' · '+t)+'" aria-label="Ver foto de la '+t+' de '+esc(mk.nombre)+'"><img src="'+f.mini+'" alt=""></button>':'';
  return '<div class="thumbs">'+one(p,'pastilla')+one(c,'caja')+'</div>'}
function verFoto(fileId,titulo){
  openModal('<h3>'+esc(titulo)+'</h3><div class="bigfoto" id="bigfoto"><div class="muted">Cargando foto…</div></div><div class="err"></div><div class="formfoot"><button type="button" class="btn" data-close>Cerrar</button></div>',null);
  api('getFotoGrande',S.clave,fileId).then(src=>{const b=document.getElementById('bigfoto');if(b)b.innerHTML='<img src="'+src+'" alt="'+esc(titulo)+'">'})
   .catch(x=>{const e=document.querySelector('#ov .err');if(e)e.textContent=errMsg(x)})}
function achicar(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(fail('No se pudo leer el archivo.'));
  fr.onload=()=>{const img=new Image();img.onerror=()=>rej(fail('Ese archivo no es una imagen que se pueda leer. Probá con una foto JPG o PNG.'));
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q))};
    img.src=fr.result};fr.readAsDataURL(file)})}
function slotFoto(mk,t){const f=fotoDe(mk.id,t);const lab=t==='caja'?'Caja':'Pastilla';
  return '<div class="fslot"><div class="fimg">'+(f?'<img src="'+f.mini+'" alt="Foto de la '+t+'">':'<span>Sin foto</span>')+'</div>'+
    '<div class="fname">'+lab+'</div><label class="btn fbtn">'+(f?'Cambiar':'Sacar / subir foto')+'<input type="file" accept="image/*" data-subir="'+t+'" data-mk="'+esc(mk.id)+'" hidden></label>'+
    (f?'<button type="button" class="btn fbtn" data-quitar="'+t+'" data-mk="'+esc(mk.id)+'">Quitar</button>':'')+'<div class="fstat small muted"></div></div>'}
function bindFotos(box,onChange){
  box.addEventListener('change',async e=>{const inp=e.target.closest('[data-subir]');if(!inp||!inp.files||!inp.files[0])return;
    const t=inp.dataset.subir,mk=inp.dataset.mk,st=inp.closest('.fslot').querySelector('.fstat');st.style.color='';st.textContent='Preparando foto…';
    try{const grande=await achicar(inp.files[0],1000,0.8);const mini=await achicar(inp.files[0],220,0.7);st.textContent='Guardando…';
      S.fotos=await api('subirFoto',S.clave,S.quien,{marcaId:mk,tipo:t,grande,mini})||{};onChange();toast('Foto guardada')}
    catch(x){st.style.color='var(--red)';st.textContent=errMsg(x)}});
  box.addEventListener('click',async e=>{const q=e.target.closest('[data-quitar]');if(!q)return;
    if(!q.dataset.armed){q.dataset.armed='1';q.textContent='¿Seguro? Tocá de nuevo';return}
    q.disabled=true;q.textContent='Quitando…';
    try{S.fotos=await api('borrarFoto',S.clave,S.quien,{marcaId:q.dataset.mk,tipo:q.dataset.quitar})||{};onChange();toast('Foto quitada')}
    catch(x){q.disabled=false;q.textContent='Quitar';toast(errMsg(x))}});
}
function abrirMarcas(m){
  if(!marcasDe(m).length){cargarExtras().then(()=>{if(marcasDe(m).length)abrirMarcas(m);else toast('No se pudieron cargar las marcas. Probá de nuevo.')});return}
  openModal('<h3>Marcas y fotos</h3><div class="muted small">'+esc([m.droga,m.dosis].filter(Boolean).join(' ')||m.nombre)+' · la marca <b>actual</b> es la que se usa para calcular las cajas y la que se ve en Tomas. El stock se cuenta en '+esc(unidad(m,2))+', así que cambiar de marca no lo modifica.</div>'+
    '<div id="mkList"></div>'+
    '<div class="mkadd"><div class="lbl">Agregar otra marca</div><div class="grid2"><input id="mk-nom" type="text" placeholder="Nombre, ej: Gastromax 20"><input id="mk-caja" type="number" min="1" step="1" inputmode="numeric" placeholder="Unid. por caja"></div><button type="button" class="btn" id="mk-add">Agregar marca</button></div>'+
    '<div class="err"></div><div class="formfoot"><button type="button" class="btn" data-close>Cerrar</button></div>',null,ov=>{
    const list=ov.querySelector('#mkList'),er=ov.querySelector('.err');
    const draw=()=>{list.innerHTML=marcasDe(m).map(mk=>'<div class="mcard'+(mk.actual?' act':'')+'">'+
      '<div class="row"><div><b>'+esc(mk.nombre)+'</b><div class="sub small">'+(mk.porCaja?'Caja x '+mk.porCaja+' '+esc(unidad(m,2)):'Sin unidades por caja')+'</div></div>'+
      (mk.actual?'<span class="chip ok">Actual</span>':'<button type="button" class="btn primary" data-usar="'+esc(mk.id)+'">Usar esta</button>')+'</div>'+
      '<div class="mkedit" hidden><div class="grid2"><input data-f="nom" type="text" value="'+esc(mk.nombre)+'" aria-label="Nombre de la marca"><input data-f="caja" type="number" min="1" step="1" inputmode="numeric" value="'+(mk.porCaja??'')+'" placeholder="Unid. por caja" aria-label="Unidades por caja"></div>'+
      '<div class="actions"><button type="button" class="btn primary" data-guardar="'+esc(mk.id)+'">Guardar</button><button type="button" class="btn" data-cancel>Cancelar</button></div></div>'+
      '<div class="fotoSlots">'+slotFoto(mk,'caja')+slotFoto(mk,'pastilla')+'</div>'+
      '<div class="actions"><button type="button" class="btn" data-editmk>Editar nombre / caja</button>'+(mk.actual?'':'<button type="button" class="btn danger" data-borrar="'+esc(mk.id)+'">Borrar</button>')+'</div></div>').join('')};
    draw();
    const run=async(fn,arg,btn,msg)=>{er.textContent='';if(btn)btn.disabled=true;
      try{aplicarResp(await api(fn,S.clave,S.quien,arg));if(fn==='borrarMarca')S.fotos=await api('getFotos',S.clave);draw();toast(msg);return true}catch(x){er.textContent=errMsg(x);if(btn)btn.disabled=false;return false}};
    ov.addEventListener('click',e=>{const t=e.target;
      const u=t.closest('[data-usar]');if(u){run('usarMarca',{marcaId:u.dataset.usar},u,'Marca cambiada');return}
      if(t.closest('[data-editmk]')){t.closest('.mcard').querySelector('.mkedit').hidden=false;return}
      if(t.closest('[data-cancel]')){t.closest('.mkedit').hidden=true;return}
      const g=t.closest('[data-guardar]');if(g){const c=g.closest('.mcard');run('guardarMarca',{marcaId:g.dataset.guardar,medId:m.id,nombre:c.querySelector('[data-f=nom]').value,porCaja:c.querySelector('[data-f=caja]').value},g,'Marca guardada');return}
      const b=t.closest('[data-borrar]');if(b){if(!b.dataset.armed){b.dataset.armed='1';b.textContent='¿Seguro? Tocá de nuevo';return}run('borrarMarca',{marcaId:b.dataset.borrar},b,'Marca borrada');return}
      if(t.id==='mk-add'){const n=ov.querySelector('#mk-nom'),cj=ov.querySelector('#mk-caja');run('guardarMarca',{medId:m.id,nombre:n.value,porCaja:cj.value},t,'Marca agregada').then(ok=>{t.disabled=false;if(ok){n.value='';cj.value=''}});return}
    });
    bindFotos(list,()=>{draw();renderTomas();renderStock()});
  });
}
function setTab(t){S.tab=t;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  document.querySelectorAll('section[id^=tab-]').forEach(s=>s.hidden=s.id!=='tab-'+t);ls.set('medtab',t);window.scrollTo(0,0)}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab)});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){const m=S.meds.get(b.dataset.id),a=b.dataset.act;
    if(a==='compra'&&m)abrirCompra(m);else if(a==='recuento'&&m)abrirRecuento(m);else if(a==='editar'&&m)abrirEditar(m);else if(a==='marcas'&&m)abrirMarcas(m);else if(a==='nuevo')abrirEditar(null);else if(a==='bulk')abrirBulk();else if(a==='config')abrirConfig();
    return}
  const go=e.target.closest('[data-goto]');if(go){setTab(go.dataset.goto);return}
  if(e.target.id==='pdfTomas'){verHoja();return}
  const fi=e.target.closest('[data-fotofile]');if(fi){verFoto(fi.dataset.fotofile,fi.dataset.fototit);return}
  if(e.target.id==='copiar'){const t=document.getElementById('listaFarm').textContent;
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('Lista copiada'),()=>selectText());else selectText()}
});
function selectText(){const r=document.createRange();r.selectNodeContents(document.getElementById('listaFarm'));const s=getSelection();s.removeAllRanges();s.addRange(r);
  let ok=false;try{ok=document.execCommand('copy')}catch(x){}toast(ok?'Lista copiada':'Texto seleccionado: copialo')}
document.addEventListener('change',e=>{if(e.target.id==='verInact'){S.showInactive=e.target.checked;renderStock()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.innerHTML)closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!modal.innerHTML&&S.ready)refresh()});
{const t=ls.get('medtab');if(t&&document.getElementById('tab-'+t))setTab(t)}
render();

/* ===== Arranque ===== */
if('serviceWorker' in navigator&&window.isSecureContext){navigator.serviceWorker.register('sw.js').catch(()=>{})}
(async()=>{
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  try{await cargarDB()}
  catch(e){show('cargando');document.getElementById('cargando').innerHTML='No se pudo abrir el almacenamiento de este dispositivo.<br><span class="small">'+esc(e&&e.message||e)+'</span>';return}
  if(!D.config){show('setup');return}
  S.config=Object.assign({},S.config,D.config);setTitle();
  entrar();
})();
})();
